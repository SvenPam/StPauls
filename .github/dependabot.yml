version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Pinned to the Playwright whose Chromium the cloud sandbox ships (/opt/pw-browsers), so tests run the
    # same everywhere. Bump it by hand when the sandbox image moves on.
    ignore:
      - dependency-name: "@playwright/test"
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
