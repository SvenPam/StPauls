name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'infra/**'
      - '.pages.yml'
      - 'tests/**'
      - '.github/workflows/deploy.yml'
  pull_request:
  # Nightly rebuild so past events drop off the calendar.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# A second Pages CMS save waits for the running deploy, then ships the newer commit.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.167.0

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v6

      - name: Install Hugo
        run: |
          mkdir -p "$RUNNER_TEMP/hugo"
          curl -fsSL -o "$RUNNER_TEMP/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/hugo/hugo" version

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 7

  deploy:
    needs: test
    # No environment: here. It would change the OIDC subject the federated credential trusts.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Hugo
        run: |
          mkdir -p "$RUNNER_TEMP/hugo"
          curl -fsSL -o "$RUNNER_TEMP/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/hugo/hugo" version

      - name: Build
        run: hugo --source site --minify

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infra
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name stpauls-web \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --query properties.outputs -o json > "$RUNNER_TEMP/outputs.json"
          name=$(jq -r .name.value "$RUNNER_TEMP/outputs.json")
          hostname=$(jq -r .defaultHostname.value "$RUNNER_TEMP/outputs.json")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "hostname=$hostname" >> "$GITHUB_OUTPUT"
          echo "Site: https://$hostname" >> "$GITHUB_STEP_SUMMARY"

      - name: Read deployment token
        id: token
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          NAME: ${{ steps.infra.outputs.name }}
        run: |
          token=$(az staticwebapp secrets list --name "$NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: site/public
          output_location: ""
          skip_app_build: true
