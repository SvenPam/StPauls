name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'config/**'
      - 'eleventy.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'infra/**'
      - '.pages.yml'
      - 'tests/**'
      - '.github/workflows/deploy.yml'
  pull_request:
  # Nightly rebuild so past events drop off the calendar.
  # Weekly audit: the only run where npm audit findings turn the workflow red.
  schedule:
    - cron: '17 3 * * *'
    - cron: '41 4 * * 1'
  workflow_dispatch:

# Read only by default. Only the deploy job asks for an Azure token, and it runs no npm code.
permissions:
  contents: read

# A second Pages CMS save waits for the running deploy, then ships the newer commit.
# The weekly audit has its own group so it cannot replace a deploy that is waiting.
concurrency:
  group: ${{ github.event.schedule == '41 4 * * 1' && 'audit' || 'deploy' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event.schedule != '41 4 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Resized images. A new sharp or new image settings start afresh; a new upload starts from the last cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/images
          key: images-${{ hashFiles('package-lock.json', 'config/images.js') }}-${{ hashFiles('site/static/uploads/**', 'site/assets/images/**') }}
          restore-keys: images-${{ hashFiles('package-lock.json', 'config/images.js') }}-

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _site
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 7

  # Reports known vulnerabilities. Never blocks a deploy: deploy needs only build.
  audit:
    runs-on: ubuntu-24.04
    continue-on-error: ${{ github.event.schedule != '41 4 * * 1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install without running scripts
        run: npm ci --ignore-scripts

      - name: Audit
        run: npm audit

  deploy:
    needs: build
    # No environment: here. It would change the OIDC subject the federated credential trusts.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.schedule != '41 4 * * 1'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      # Needed for infra/ only. No node, npm or npx runs in this job.
      # Full history, so the push's before commit is here to compare infra/ with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Bicep only runs when infra/ changed, on a manual run, or when the push cannot be compared.
      - name: Check for infrastructure changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/infra-changed.sh "$EVENT" "$BEFORE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infra
        if: steps.changes.outputs.infra == 'true'
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name stpauls-web \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --query properties.outputs -o json > "$RUNNER_TEMP/outputs.json"
          name=$(jq -r .name.value "$RUNNER_TEMP/outputs.json")
          hostname=$(jq -r .defaultHostname.value "$RUNNER_TEMP/outputs.json")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "hostname=$hostname" >> "$GITHUB_OUTPUT"
          echo "Site: https://$hostname" >> "$GITHUB_STEP_SUMMARY"

      # Bicep skipped: the last deployment's outputs name the same resource.
      - name: Read last deployment
        id: last
        if: steps.changes.outputs.infra != 'true'
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name stpauls-web \
            --query properties.outputs -o json > "$RUNNER_TEMP/outputs.json"
          name=$(jq -r .name.value "$RUNNER_TEMP/outputs.json")
          hostname=$(jq -r .defaultHostname.value "$RUNNER_TEMP/outputs.json")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "hostname=$hostname" >> "$GITHUB_OUTPUT"
          echo "Site: https://$hostname (infrastructure unchanged)" >> "$GITHUB_STEP_SUMMARY"

      - name: Read deployment token
        id: token
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          NAME: ${{ steps.infra.outputs.name || steps.last.outputs.name }}
        run: |
          token=$(az staticwebapp secrets list --name "$NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: _site
          output_location: ""
          skip_app_build: true
