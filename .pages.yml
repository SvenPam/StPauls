media:
  input: site/static/uploads
  output: /uploads

# Keep front matter keys the form does not show, such as the hidden url on migrated items.
settings:
  content:
    merge: true

content:
  - name: blog
    label: Blog
    type: collection
    path: site/content/blog
    filename: "{year}-{month}-{day}-{primary}.md"
    exclude: [_index.md]
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    operations:
      rename: false
    fields:
      - name: title
        label: Title
        type: string
        required: true
        pattern:
          regex: "^(?![Ii]ndex$).+"
          message: Pick another title
      - name: date
        label: Date
        type: date
        required: true
      - name: author
        label: Author
        description: Who wrote it, shown as "by ..." on the article
        type: string
        required: true
      - name: summary
        label: Summary
        description: Short text shown on the blog list and at the top of the article
        type: string
      - name: image
        label: Image
        type: image
      - name: image_alt
        label: Image description
        type: string
      - name: blogtopics
        label: Topic
        type: select
        options:
          values:
            - name: website
              label: Website
            - name: church-services
              label: Church Services
            - name: church-events
              label: Church Events
            - name: other-events
              label: Other Events
      - name: url
        type: string
        hidden: true
      - name: body
        label: Article
        type: rich-text
        required: true
        options:
          format: markdown
  - name: events
    label: Events
    type: collection
    path: site/content/calendar
    filename: "{year}-{month}-{day}-{primary}.md"
    exclude: [_index.md]
    view:
      fields: [title, date, end]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    operations:
      rename: false
    fields:
      - name: title
        label: Title
        type: string
        required: true
        pattern:
          regex: "^(?![Ii]ndex$).+"
          message: Pick another title
      - name: date
        label: Starts
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ss
      - name: end
        label: Ends
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ss
      - name: summary
        label: Summary
        description: Short text shown on the calendar and at the top of the event
        type: string
      - name: location
        label: Location
        type: string
      - name: image
        label: Image
        type: image
      - name: image_alt
        label: Image description
        type: string
      - name: eventtopics
        label: Topic
        type: select
        options:
          values:
            - name: website
              label: Website
            - name: church-services
              label: Church Services
            - name: church-events
              label: Church Events
            - name: other-events
              label: Other Events
      - name: url
        type: string
        hidden: true
      - name: body
        label: Event details
        type: rich-text
        required: true
        options:
          format: markdown
  - name: notices
    label: Notices
    type: collection
    path: site/content/notices
    filename: "{year}-{month}-{day}-{primary}.md"
    exclude: [_index.md]
    view:
      fields: [title, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    operations:
      rename: false
    fields:
      - name: title
        label: Title
        type: string
        required: true
        pattern:
          regex: "^(?![Ii]ndex$).+"
          message: Pick another title
      - name: date
        label: Show from
        description: The notice shows on the home page from this day
        type: date
        required: true
      - name: until
        label: Show until
        description: Optional. The notice is taken down after this day
        type: date
      - name: summary
        label: Summary
        description: Short text shown on the list of notices
        type: string
      - name: location
        label: Location
        type: string
      - name: noticetopics
        label: Topic
        type: select
        options:
          values:
            - name: website
              label: Website
            - name: church-services
              label: Church Services
            - name: church-events
              label: Church Events
            - name: other-events
              label: Other Events
      - name: url
        type: string
        hidden: true
      - name: body
        label: Notice
        type: rich-text
        required: true
        options:
          format: markdown
  - name: home
    label: Home page
    type: file
    path: site/content/_index.md
    operations:
      delete: false
    fields:
      - name: title
        label: Title
        type: string
        required: true
        pattern:
          regex: "^(?![Ii]ndex$).+"
          message: Pick another title
      - name: lead
        label: Strapline
        description: The line under the title on the big picture
        type: string
      - name: hero_image
        label: Hero image
        type: image
      - name: hero_alt
        label: Hero image description
        description: Leave empty if the picture is only decoration
        type: string
      - name: description
        label: Search description
        description: Shown under the link in search results and on Facebook
        type: string
  - name: blog-index
    label: Blog page
    type: file
    path: site/content/blog/_index.md
    operations:
      delete: false
    fields:
      - name: description
        label: Search description
        description: Shown under the link in search results
        type: string
  - name: calendar-index
    label: Calendar page
    type: file
    path: site/content/calendar/_index.md
    operations:
      delete: false
    fields:
      - name: description
        label: Search description
        description: Shown under the link in search results
        type: string
  - name: notices-index
    label: Notices page
    type: file
    path: site/content/notices/_index.md
    operations:
      delete: false
    fields:
      - name: description
        label: Search description
        description: Shown under the link in search results
        type: string
  - name: settings
    label: Site settings
    type: file
    path: site/data/settings.yaml
    format: yaml
    operations:
      delete: false
    fields:
      - name: contact_access_key
        label: Contact form key
        description: From web3forms.com. Leave empty to hide the form.
        type: string
        pattern:
          regex: "^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
          message: Paste the whole key, or leave it empty
      - name: contact_subject
        label: Email subject
        type: string
        required: true
      - name: enquiry_types
        label: Enquiry types
        type: string
        list: true
      - name: address
        label: Address lines
        type: string
        list: true
      - name: facebook_url
        label: Facebook page
        type: string
      - name: map_url
        label: Map link
        type: string
      - name: directions_url
        label: Directions link
        type: string
  - name: pages
    label: Pages
    type: group
    items:
      - name: page-about
        label: About
        type: collection
        path: site/content/page/about
        filename: "{primary}.md"
        exclude: [_index.md]
        view:
          fields: [title, header, footer, weight]
          primary: title
        operations:
          rename: false
        fields:
          - name: title
            label: Title
            type: string
            required: true
            pattern:
              regex: "^(?![Ii]ndex$).+"
              message: Pick another title
          - name: summary
            label: Summary
            description: Short text shown at the top of the page
            type: string
          - name: header
            label: Show in the top menu
            type: boolean
          - name: footer
            label: Show in the footer
            type: boolean
          - name: hidden
            label: Hidden
            description: Hidden pages are not on the site
            type: boolean
          - name: weight
            label: Order in menu (lower comes first)
            type: number
            default: 100
          - name: image
            label: Image
            type: image
          - name: image_alt
            label: Image description
            type: string
          - name: body
            label: Page
            type: rich-text
            required: true
            options:
              format: markdown
          - name: embed
            label: Embedded calendar or gallery
            type: select
            options:
              values:
                - name: google-calendar
                  label: Church diary
                - name: facebook-album
                  label: Photos from the church Facebook page
          - name: embed_src
            label: Embed address
            description: Paste the address the calendar or gallery gives you
            type: string
          - name: url
            type: string
            hidden: true
          - name: layout
            type: string
            hidden: true
