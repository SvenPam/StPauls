{{ define "main" }}
<div class="with-aside">
<article>
  <h1>{{ .Title }}</h1>
  <div class="meta">
    <span class="date-time">Published {{ partial "date.html" .Date }}</span>
    {{- with partial "topic-link.html" . }}
    <p class="topic-line">Topic: {{ . }}</p>
    {{- end }}
  </div>
  {{- with .Params.summary }}
  <p class="lead">{{ . }}</p>
  {{- end }}
  {{ partial "image.html" . }}
  <div class="prose">
    {{ partial "body.html" . }}
  </div>
</article>
{{ partial "blog-aside.html" site }}
</div>
{{ end }}
