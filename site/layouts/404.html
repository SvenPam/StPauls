{{ define "main" }}
<div class="container">
    <h1>Page Not Found</h1>
    <h4>We're sorry but we couldn't find that page.</h4>
    <hr>
    <div class="container">
        <div class="row">
            <p>This could be because:</p>
            <ul>

            </ul>

        </div>
    </div>
</div>
{{ end }}
