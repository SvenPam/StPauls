{{ define "main" }}
<h1>{{ .Title }}</h1>
{{- with .Pages.ByDate.Reverse }}
<div class="card-grid">
  {{- range . }}
  <article class="card">
    <h2 class="card__title"><a href="{{ partial "href.html" .RelPermalink }}">{{ .Title }}</a></h2>
    <span class="date-time notice-date">{{ .Date.Format "02-Jan-06" }}</span>
    {{- with .Params.summary }}
    <p class="notice-summary">{{ . }}</p>
    {{- end }}
  </article>
  {{- end }}
</div>
{{- else }}
<p>Could not find any notices.</p>
{{- end }}
{{ end }}
