{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  <div class="meta">
    <span class="date-time notice-date">{{ .Date.Format "02-Jan-06" }}</span>
    {{- with .Params.location }}
    <address class="notice-location">{{ . }}</address>
    {{- end }}
  </div>
  <div class="prose">
    {{ .Content }}
  </div>
  <p><a href="/notices">Back to notices</a></p>
</article>
{{ end }}
