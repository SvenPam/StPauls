{{ define "main" }}
<div class="container">
    <h1>{{ .Title }}</h1>
    <div class="col-xs-12">
        <span class="date-time notice-date">{{ .Date.Format "02-Jan-06" }}</span>
        {{- with .Params.location }}
        <address class="notice-location">{{ . }}</address>
        {{- end }}
        <hr>
    </div>
    <div class="col-xs-12 article-body">
        {{ .Content }}
    </div>
</div>
{{ end }}
