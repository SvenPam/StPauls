{{- $here := partial "href.html" .RelPermalink -}}
<header class="site-header">
  <div class="site-header__bar">
    <a class="site-brand" href="/">{{ site.Title }}</a>
    <a class="menu-toggle" href="#site-nav"><span class="menu-toggle__icon" aria-hidden="true"></span>Menu</a>
  </div>
  <nav id="site-nav" class="site-nav" aria-label="Main">
    <ul class="site-nav__list">
      {{- range partial "menu-items.html" site }}
      {{- if .children }}
      <li><details class="site-nav__group" name="site-nav"><summary>{{ .name }}</summary>
        <ul>
          {{- range .children }}
          <li><a href="{{ .url }}"{{ if eq .url $here }} aria-current="page"{{ end }}>{{ .name }}</a></li>
          {{- end }}
        </ul></details></li>
      {{- else }}
      <li><a href="{{ .url }}"{{ if eq .url $here }} aria-current="page"{{ end }}>{{ .name }}</a></li>
      {{- end }}
      {{- end }}
    </ul>
  </nav>
</header>
